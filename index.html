<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Input Tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-container">
    <h2>Data Submission Form</h2>
    <!-- Input File Name -->
  <div class="form-group">
    <label for="input-filename">Input File Name</label>
    <input type="text" id="input-filename" placeholder="e.g., input_data.csv" required>
  </div>

  <!-- Output File Name -->
  <div class="form-group">
    <label for="output-filename">Output File Name</label>
    <input type="text" id="output-filename" placeholder="e.g., output_results.csv" required>
  <!-- Date Field Name Input -->
  <div class="form-group">
    <label for="date-field-name">Date Field Name</label>
    <input type="text" id="date-field-name" placeholder="e.g., created_at or transaction_date" required>
  </div>
  </div>
    <form id="tool-form">
      <!-- Dates Section -->
      <div class="form-group">
        <div class="dynamic-header">
          <label>Dates</label>
          <button type="button" id="add-date-btn" class="btn-add">+</button>
        </div>
        <div id="dates-container">
          <div class="field-row">
            <input type="text" name="dynamic-date" placeholder="e.g., 2026-08-29" required>
          </div>
        </div>
      </div>

      <!-- Fields Section -->
      <div class="form-group">
        <div class="dynamic-header">
          <label>Fields</label>
          <button type="button" id="add-field-btn" class="btn-add">+</button>
        </div>
        <div id="fields-container">
          <div class="field-row">
            <input type="text" name="dynamic-field" placeholder="Enter value" required>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit">Submit to Backend</button>
    </form>
    <!-- Quit Button -->
    <button id="quitBtn" onclick="quitApp()" style="background-color: #d9534f; color: white;">
      Quit Application
    </button>
    <script>
        async function quitApp() {
            if (!confirm("Are you sure you want to shut down the server and exit?")) {
                return;
            }

            try {
                await fetch('http://localhost:5000/api/quit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
            } catch (err) {
                console.log("Server stopped or unreachable.");
            }

            // Modern browsers restrict script-closing tabs unless opened by script,
            // so we attempt window.close() and fallback to clearing/notifying the document.
            window.close();

            document.body.innerHTML = `
                <div style="font-family: sans-serif; text-align: center; padding-top: 50px;">
                    <h2>Server standard shutdown complete.</h2>
                     <p>You can safely close this browser tab.</p>
                </div>
            `;
        }
    </script>

    <div id="status-message"></div>
  </div>

  <script src="frontend.js"></script>
</body>
</html>
